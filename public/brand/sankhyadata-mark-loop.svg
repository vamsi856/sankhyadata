<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="192" height="192" fill="none" overflow="visible">
  <title>SankhyaData</title>
  <style>
    /* 4 s cycle: the frame searches, locks onto the point, holds, releases. */
    .c { transform-box: fill-box; animation: frame 4s cubic-bezier(.65,0,.35,1) infinite; }
    .c1 { --x: -3px; --y: -3px; } .c2 { --x: 3px; --y: -3px; } .c3 { --x: 3px; --y: 3px; } .c4 { --x: -3px; --y: 3px; }
    .d { transform-box: fill-box; transform-origin: center; animation: point 4s cubic-bezier(.22,1,.36,1) infinite; }
    @keyframes frame {
      0%, 100% { transform: translate(var(--x), var(--y)); opacity: .45; }
      30%, 75% { transform: none; opacity: 1; }
    }
    @keyframes point {
      0%, 22% { transform: scale(0); }
      34% { transform: scale(1.3); }
      42%, 78% { transform: scale(1); }
      92%, 100% { transform: scale(0); }
    }
    @media (prefers-reduced-motion: reduce) { .c, .d { animation: none; } }
  </style>
  <g stroke="#111417" stroke-width="1.6">
    <path class="c c1" d="M3 8V3h5"/><path class="c c2" d="M16 3h5v5"/><path class="c c3" d="M21 16v5h-5"/><path class="c c4" d="M8 21H3v-5"/>
  </g>
  <circle class="d" cx="12" cy="12" r="3.2" fill="#c0f447" stroke="#151e03" stroke-width="1"/>
</svg>
