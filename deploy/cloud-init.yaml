#cloud-config
# First boot of the dedicated SankhyaData web server (Hetzner project "sankhyadata").
# Installs Caddy and the site updater; Caddy obtains HTTPS certificates automatically.
package_update: true
package_upgrade: true
packages:
  - curl
  - gnupg
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https
  - unattended-upgrades

write_files:
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  - curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt -o /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y caddy
  - mkdir -p /etc/caddy/sites
  - printf '# SankhyaData web server. Sites live in /etc/caddy/sites/.\n' > /etc/caddy/Caddyfile
  - systemctl enable caddy
  - systemctl restart caddy
  - curl -fsSL https://raw.githubusercontent.com/vamsi856/sankhyadata/main/deploy/setup-pull.sh | bash
