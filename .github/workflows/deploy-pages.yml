name: Deploy to GitHub Pages

# Every push to main builds the site and force-pushes the built files, and nothing else, as a
# single commit to the gh-pages branch of the public output repo vamsi856/sankhyadata-live.
# GitHub Pages serves that branch at https://sankhyadata.com, so this source repo can be
# private on a free plan.
#
# Needs the secret LIVE_DEPLOY_KEY: the private half of an SSH deploy key with write access to
# vamsi856/sankhyadata-live only (scripts/move-to-pages.sh sets it up). Until the domain points
# at GitHub Pages a missing key only warns; after that it fails the run, so the live site never
# goes stale with every run green.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      LIVE_REPO: vamsi856/sankhyadata-live
      DOMAIN: sankhyadata.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Add the GitHub Pages files
        run: |
          # The custom domain, and no Jekyll processing (it would drop /.well-known/).
          echo "$DOMAIN" > dist/CNAME
          touch dist/.nojekyll
          for f in index.html 404.html privacy/index.html .well-known/security.txt robots.txt sitemap.xml; do
            test -s "dist/$f" || { echo "::error::dist/$f is missing"; exit 1; }
          done

      - name: Publish to the output repo
        env:
          KEY: ${{ secrets.LIVE_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$KEY" ]; then
            if getent ahostsv4 "$DOMAIN" | grep -q '^185\.199\.'; then
              echo "::error::LIVE_DEPLOY_KEY is not set (or has been removed); $DOMAIN is not being updated"
              exit 1
            fi
            echo "::warning::LIVE_DEPLOY_KEY is not set; the site was built but not published to $LIVE_REPO"
            exit 0
          fi
          # The deploy key, and GitHub's SSH host keys from its API over verified HTTPS.
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/live_key
          chmod 600 ~/.ssh/live_key
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          [ -s ~/.ssh/known_hosts ] || { echo "::error::could not read GitHub's SSH host keys"; exit 1; }
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site built from ${GITHUB_REPOSITORY}@${GITHUB_SHA::12}"
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/live_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            git push --force -q "git@github.com:${LIVE_REPO}.git" gh-pages
          rm -f ~/.ssh/live_key
          echo "Pushed to ${LIVE_REPO}@gh-pages; GitHub Pages publishes it within about a minute."

      - name: Check the live site
        env:
          KEY: ${{ secrets.LIVE_DEPLOY_KEY }}
        run: |
          [ -n "$KEY" ] || exit 0
          # Before the DNS move the old server answers; nothing to wait for.
          getent ahostsv4 "$DOMAIN" | grep -q '^185\.199\.' || { echo "$DOMAIN does not point at GitHub Pages yet"; exit 0; }
          want=$(grep -o 'index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          for i in $(seq 1 12); do
            live=$(curl -fsS --max-time 10 "https://${DOMAIN}/?v=${GITHUB_SHA::7}$i" | grep -o 'index-[A-Za-z0-9_-]*\.js' | head -1 || true)
            if [ "$live" = "$want" ]; then echo "https://${DOMAIN} serves this build ($want)"; exit 0; fi
            sleep 15
          done
          echo "::notice::https://${DOMAIN} does not serve this build yet (wanted $want, saw ${live:-nothing}). Before the DNS move this is expected; after it, GitHub Pages may still be building or its cache (10 minutes) is stale."
