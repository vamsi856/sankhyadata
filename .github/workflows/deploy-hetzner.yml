name: Deploy to Hetzner

# GitHub only holds the code. Every push to main builds the site and publishes the result
# to the "live" release. The Hetzner server pulls it from there every 2 minutes
# (deploy/pull.sh, installed once by deploy/setup-pull.sh) and Caddy serves
# https://sankhyadata.com. No server credentials are stored in GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Package the built site
        run: |
          mkdir out
          tar -C dist -czf out/site.tar.gz .
          cp deploy/sankhyadata.caddy out/
          (cd out && sha256sum site.tar.gz sankhyadata.caddy > sha256sums.txt)
          echo "${GITHUB_SHA::12}" > out/version.txt

      - name: Publish to the live release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view live >/dev/null 2>&1 || gh release create live \
            --title "Live site" --latest=false \
            --notes "Built site that the Hetzner server pulls. Replaced on every push to main."
          gh release upload live out/site.tar.gz out/sankhyadata.caddy out/sha256sums.txt --clobber
          # version.txt goes last, so the server never sees a version before its files.
          gh release upload live out/version.txt --clobber

      - name: Check the live site
        run: |
          if curl -fsS -o /dev/null --max-time 20 https://sankhyadata.com/; then
            echo "https://sankhyadata.com is serving (the server picks up this build within 2 minutes)"
          else
            echo "::notice::https://sankhyadata.com is not serving yet. Run deploy/setup-pull.sh on the server once."
          fi
